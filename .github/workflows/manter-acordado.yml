name: Manter app acordado

on:
  schedule:
    - cron: "0 */6 * * *"   # a cada 6 horas (horário UTC)
  workflow_dispatch:         # permite rodar manualmente pela aba Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_URL: "https://acnnorte-essrv5zwd6wxhycac5fjcs.streamlit.app/"
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar navegador
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visitar o app e acordar se estiver dormindo
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]
          with sync_playwright() as p:
              page = p.chromium.launch().new_page()
              page.goto(url, timeout=120000)
              page.wait_for_timeout(10000)
              botao = page.get_by_text("Yes, get this app back up!")
              if botao.count():
                  print("App estava dormindo, acordando...")
                  botao.first.click()
                  page.wait_for_timeout(90000)
              else:
                  print("App ja estava acordado.")
              print("Titulo da pagina:", page.title())
          PY
